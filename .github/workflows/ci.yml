name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # the theme generator: what the app renders is what the Themer downloads
      - name: Theme tests
        run: pnpm --filter web exec vitest run --project unit

      - name: Typecheck
        run: pnpm typecheck

      - name: Story tests
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec vitest run --project storybook
