name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tokens.css is generated from tokens/*.json — a hand-edit to the
      # generated block fails here rather than drifting silently
      - name: Tokens are in sync
        run: pnpm --filter @workspace/ui tokens:build --check

      - name: Tokens are legible
        run: pnpm --filter @workspace/ui tokens:check

      # the theme studio's shared core — the hosted studio commits through this
      # without a human reading the diff, so it is covered here
      - name: Theme core tests
        run: pnpm --filter @workspace/ui test

      - name: Typecheck
        run: pnpm typecheck

      - name: Story tests
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec vitest run --project storybook
